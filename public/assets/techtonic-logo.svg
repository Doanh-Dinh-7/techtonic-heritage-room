<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#0080FF" />
      <stop offset="100%" stop-color="#7000FF" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Hexagonal Tech Icon -->
  <g transform="translate(10, 10)">
    <polygon points="50,5 90,28 90,72 50,95 10,72 10,28" fill="none" stroke="url(#techGrad)" stroke-width="4" filter="url(#glow)"/>
    <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="#0c101c" stroke="#00F0FF" stroke-width="1.5" opacity="0.8"/>
    <!-- T Letter in Logo -->
    <path d="M35 38 L65 38 M50 38 L50 68" stroke="#00F0FF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="50" cy="50" r="3" fill="#FFFFFF" />
  </g>

  <!-- Typography -->
  <g transform="translate(125, 62)">
    <text font-family="'Outfit', 'Inter', sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="3">
      TECH<tspan fill="url(#techGrad)">TONIC</tspan>
    </text>
    <text y="28" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="13" fill="#00F0FF" letter-spacing="6">
      HERITAGE ROOM
    </text>
  </g>
</svg>
